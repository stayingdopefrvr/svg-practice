<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle wheels -->
  <circle cx="60" cy="150" r="30" fill="black"/>
  <circle cx="140" cy="150" r="30" fill="black"/>
  <circle cx="60" cy="150" r="28" fill="white"/>
  <circle cx="140" cy="150" r="28" fill="white"/>
  <!-- Bike frame -->
  <path d="M60 150 L60 80 Q60 60 80 60 L120 60 Q140 60 140 80 L140 150 Z" fill="none" stroke="black" stroke-width="4"/>
  <!-- Handlebar -->
  <line x1="140" y1="70" x2="150" y2="50" stroke="black" stroke-width="4"/>
  <line x1="150" y1="50" x2="155" y2="55" stroke="black" stroke-width="4"/>
  <!-- Seat -->
  <rect x="80" y="55" width="20" height="15" fill="none" stroke="black" stroke-width="4"/>
  <!-- Pelican body -->
  <ellipse cx="150" cy="100" rx="30" ry="20" fill="gray"/>
  <!-- Pelican head -->
  <polygon points="180,90 200,70 200,110" fill="gray"/>
  <!-- Pelican beak -->
  <polygon points="200,95 210,90 210,100" fill="orange"/>
  <!-- Pelican eye -->
  <circle cx="190" cy="95" r="2" fill="black"/>
  <!-- Pelican wing -->
  <path d="M150 100 Q100 80 120 100" fill="none" stroke="gray" stroke-width="4"/>
  <!-- Pelican feet -->
  <line x1="150" y1="150" x2="140" y2="160" stroke="gray" stroke-width="4"/>
  <line x1="170" y1="150" x2="180" y2="160" stroke="gray" stroke-width="4"/>
</svg>