<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <path d="M0,250 Q200,230 400,250 L400,300 L0,300 Z" fill="#8FBC8F"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700"/>
  
  <!-- Bicycle -->
  <g transform="translate(150, 180)">
    <!-- Rear wheel -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <!-- Spokes rear -->
    <g stroke="#666" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="-35"/>
      <line x1="0" y1="0" x2="25" y2="-25"/>
      <line x1="0" y1="0" x2="35" y2="0"/>
      <line x1="0" y1="0" x2="25" y2="25"/>
      <line x1="0" y1="0" x2="0" y2="35"/>
      <line x1="0" y1="0" x2="-25" y2="25"/>
      <line x1="0" y1="0" x2="-35" y2="0"/>
      <line x1="0" y1="0" x2="-25" y2="-25"/>
    </g>
    
    <!-- Front wheel -->
    <circle cx="90" cy="0" r="35" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="90" cy="0" r="8" fill="#333"/>
    <!-- Spokes front -->
    <g stroke="#666" stroke-width="1.5">
      <line x1="90" y1="0" x2="90" y2="-35"/>
      <line x1="90" y1="0" x2="115" y2="-25"/>
      <line x1="90" y1="0" x2="125" y2="0"/>
      <line x1="90" y1="0" x2="115" y2="25"/>
      <line x1="90" y1="0" x2="90" y2="35"/>
      <line x1="90" y1="0" x2="65" y2="25"/>
      <line x1="90" y1="0" x2="55" y2="0"/>
      <line x1="90" y1="0" x2="65" y2="-25"/>
    </g>
    
    <!-- Frame -->
    <path d="M0,0 L30,-45 L60,-45 L90,0" fill="none" stroke="#2C3E50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30,-45 L30,-5" fill="none" stroke="#2C3E50" stroke-width="5" stroke-linecap="round"/>
    <path d="M30,-5 L0,0" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <path d="M60,-45 L90,0" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Handlebars -->
    <path d="M90,0 L105,-35" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <path d="M100,-38 L110,-38" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Seat -->
    <ellipse cx="30" cy="-50" rx="12" ry="5" fill="#2C3E50"/>
    
    <!-- Pedals -->
    <g transform="rotate(-30 0 0)">
      <path d="M0,0 L-20,5" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>
      <rect x="-22" y="1" width="10" height="4" fill="#555" rx="1"/>
    </g>
  </g>
  
  <!-- Pelican -->
  <g transform="translate(200, 100)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Neck -->
    <path d="M35,0 Q55,-20 65,-35" fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M35,5 Q55,-15 65,-30" fill="none" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Head -->
    <ellipse cx="70" cy="-42" rx="15" ry="12" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Beak -->
    <path d="M85,-42 Q115,-35 125,-42 Q115,-49 85,-42" fill="#FFA500" stroke="#E69500" stroke-width="1"/>
    <path d="M85,-42 Q110,-38 118,-42 Q110,-46 85,-42" fill="#FFB340" opacity="0.5"/>
    <!-- Lower beak pouch -->
    <path d="M85,-42 Q100,-30 115,-42 Q100,-50 85,-42" fill="#FF6B6B" opacity="0.3"/>
    
    <!-- Eye -->
    <circle cx="72" cy="-45" r="3" fill="#2C3E50"/>
    <circle cx="73" cy="-46" r="1" fill="white"/>
    
    <!-- Wing -->
    <path d="M-5,0 Q-10,-30 10,-40 Q30,-30 20,0 Q10,-10 0,0" fill="#e0e0e0" stroke="#ccc" stroke-width="1"/>
    <path d="M5,0 Q0,-20 15,-28 Q25,-18 15,0" fill="#d0d0d0" opacity="0.5"/>
    
    <!-- Legs (on pedals) -->
    <g transform="translate(-5, 25)">
      <!-- Left leg -->
      <path d="M0,0 L-10,25 L-15,35" fill="none" stroke="#FFA500" stroke-width="5" stroke-linecap="round"/>
      <path d="M-15,35 L-20,38 M-15,35 L-12,38 M-15,35 L-15,42" fill="none" stroke="#FFA500" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Right leg -->
      <path d="M15,0 L25,25 L30,35" fill="none" stroke="#FFA500" stroke-width="5" stroke-linecap="round"/>
      <path d="M30,35 L35,38 M30,35 L27,38 M30,35 L30,42" fill="none" stroke="#FFA500" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Tail feathers -->
    <path d="M-35,0 Q-50,-10 -45,10 Q-40,5 -35,0" fill="#e0e0e0" stroke="#ccc" stroke-width="1"/>
    <path d="M-35,5 Q-48,0 -45,15 Q-40,8 -35,5" fill="#d0d0d0" opacity="0.5"/>
  </g>
  
  <!-- Motion lines -->
  <g stroke="#FFF" stroke-width="2" opacity="0.6">
    <line x1="50" y1="180" x2="30" y2="180"/>
    <line x1="50" y1="190" x2="30" y2="190"/>
    <line x1="50" y1="170" x2="30" y2="170"/>
    <line x1="140" y1="180" x2="120" y2="180"/>
    <line x1="140" y1="190" x2="120" y2="190"/>
    <line x1="140" y1="170" x2="120" y2="170"/>
  </g>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.9">
    <circle cx="80" cy="80" r="20"/>
    <circle cx="110" cy="70" r="25"/>
    <circle cx="140" cy="80" r="20"/>
    <circle cx="110" cy="90" r="15"/>
    
    <circle cx="300" cy="100" r="15"/>
    <circle cx="325" cy="90" r="20"/>
    <circle cx="350" cy="100" r="15"/>
    <circle cx="325" cy="110" r="12"/>
  </g>
</svg>